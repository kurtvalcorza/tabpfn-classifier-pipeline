name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - run: pip install -r requirements-test.txt ruff==0.16.6 && pip install -e . --no-deps
      - run: python -m py_compile examples/build_synthetic_dataset.py serving/load_artifact.py
      - name: Lint
        run: ruff check .
      - name: Offline tests (no tabpfn, no torch, no weights)
        run: PYTHONPATH=. pytest -q -m "not integration"
      - name: Validate tutorials and model-card source (NOTEBOOK_SPEC 1.1 standalone)
        run: python tools/validate_release_assets.py
      - name: Standalone notebook parity (PAR3)
        run: |
          python tools/build_notebook.py --check
          python tools/build_notebook.py --check --template tools/notebook_template_artifact_inference.py
      - name: Validate component manifest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("COMPONENTS.json")
          if not path.exists():
              raise SystemExit("COMPONENTS.json is required")
          data = json.loads(path.read_text())
          assert data["schemaVersion"] == 1
          for name in ("validator", "finetuner"):
              item = data["components"][name]
              assert item["repository"].startswith("kurtvalcorza/")
              assert len(item["commit"]) == 40
          PY

  # Integration tier: exercises the relocation loader with the real tabpfn
  # package on CPU (real fit -> save -> relocate -> load -> predict).
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install tabpfn==8.1.0 -r requirements-test.txt
      - run: PYTHONPATH=. pytest -q -m integration
