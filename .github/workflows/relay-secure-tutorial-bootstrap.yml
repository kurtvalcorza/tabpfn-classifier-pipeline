name: relay-secure-tutorial-bootstrap
on:
  push:
    branches: [feat/notebook-spec-1.0]
permissions:
  contents: write
jobs:
  remediate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/notebook-spec-1.0
          fetch-depth: 0
      - name: Secure and pin notebook bootstrap
        shell: python
        run: |
          import json
          from pathlib import Path

          nb_path = Path('tutorials/tabpfn_classifier_colab.ipynb')
          nb = json.loads(nb_path.read_text())
          first_code = next(c for c in nb['cells'] if c.get('cell_type') == 'code')
          first_code['source'] = '''from pathlib import Path
import base64, json, os, shutil, subprocess, sys
if sys.version_info < (3, 11):
    raise RuntimeError("This tutorial requires Python 3.11+.")
PIPE_REPO = "kurtvalcorza/tabpfn-classifier-pipeline"
PIPE_DIR = Path("/content/tabpfn-classifier-pipeline")
FT_DIR = Path("/content/tabpfn-classifier-finetuner")
REPO_REF = (os.environ.get("DIMER_TUTORIAL_REF") or "main").strip()
for d in (PIPE_DIR, FT_DIR):
    if d.exists():
        shutil.rmtree(d)
subprocess.run(["git", "clone", "--quiet", "--no-checkout", f"https://github.com/{PIPE_REPO}.git", str(PIPE_DIR)], check=True)
subprocess.run(["git", "-C", str(PIPE_DIR), "fetch", "--quiet", "--depth", "1", "origin", REPO_REF], check=True)
subprocess.run(["git", "-C", str(PIPE_DIR), "checkout", "--quiet", "--detach", "FETCH_HEAD"], check=True)
REPO_SHA = subprocess.check_output(["git", "-C", str(PIPE_DIR), "rev-parse", "HEAD"], text=True).strip()
COMPONENTS = json.loads((PIPE_DIR / "COMPONENTS.json").read_text(encoding="utf-8"))
FT_REPO = COMPONENTS["components"]["finetuner"]["repository"]
FT_COMMIT = COMPONENTS["components"]["finetuner"]["commit"]

def _github_token_from_runtime():
    token = os.environ.get("GITHUB_TOKEN", "").strip()
    if not token:
        try:
            from google.colab import userdata
            token = (userdata.get("GITHUB_TOKEN") or "").strip()
        except Exception:
            token = ""
    if not token:
        raise RuntimeError(
            "The pinned TabPFN classifier finetuner is private. Provide a GitHub token with read access "
            "as Colab Secret GITHUB_TOKEN (notebook access enabled) or environment variable GITHUB_TOKEN."
        )
    if any(ch.isspace() for ch in token):
        raise ValueError("GITHUB_TOKEN must be a single-line secret")
    return token

def _private_git_env(token):
    credential = base64.b64encode(f"x-access-token:{token}".encode()).decode()
    env = os.environ.copy()
    env.update({
        "GIT_TERMINAL_PROMPT": "0",
        "GIT_CONFIG_COUNT": "1",
        "GIT_CONFIG_KEY_0": "http.https://github.com/.extraHeader",
        "GIT_CONFIG_VALUE_0": f"Authorization: Basic {credential}",
    })
    return env

_GITHUB_TOKEN = _github_token_from_runtime()
_AUTH_ENV = _private_git_env(_GITHUB_TOKEN)
subprocess.run(["git", "clone", "--quiet", "--no-checkout", f"https://github.com/{FT_REPO}.git", str(FT_DIR)], check=True, env=_AUTH_ENV)
subprocess.run(["git", "-C", str(FT_DIR), "checkout", "--quiet", "--detach", FT_COMMIT], check=True, env=_AUTH_ENV)
del _GITHUB_TOKEN, _AUTH_ENV
subprocess.run([sys.executable, "-m", "pip", "install", "-q", "-r", str(PIPE_DIR / "tutorials" / "requirements-colab.txt")], check=True)
print({"pipelineRevision": REPO_SHA, "requestedPipelineRef": REPO_REF, "finetunerRepository": FT_REPO, "finetunerCommit": FT_COMMIT})
'''.splitlines(keepends=True)

          intro = ''.join(nb['cells'][0]['source']) if isinstance(nb['cells'][0]['source'], list) else nb['cells'][0]['source']
          old = '**Prerequisites.** Clean Google Colab runtime with Python 3.11+; CPU is sufficient for the default zero-shot path, a CUDA GPU is required for effective fine-tuning (Prior Labs recommends 80 GB for the full wrapper; the tutorial\'s small sample fits a T4). Internet access is required for the two repositories and the model weights. BYOD stays in the runtime; do not upload restricted data to an unauthorized environment.'
          new = '**Prerequisites.** Clean Google Colab runtime with Python 3.11+; CPU is sufficient for the default zero-shot path, a CUDA GPU is required for effective fine-tuning (Prior Labs recommends 80 GB for the full wrapper; the tutorial\'s small sample fits a T4). The production finetuner repository is private: add a Colab Secret named `GITHUB_TOKEN` with read access and enable notebook access. The token is passed only through an ephemeral Git authorization header; it is never printed, embedded in a clone URL, or persisted in repository config. Internet access is required for GitHub and the model weights. BYOD stays in the runtime; do not upload restricted data to an unauthorized environment.'
          if old not in intro:
              raise SystemExit('prerequisite paragraph not found')
          intro = intro.replace(old, new)
          nb['cells'][0]['source'] = intro.splitlines(keepends=True)
          nb_path.write_text(json.dumps(nb, ensure_ascii=False, indent=1) + '\n')

          p = Path('scripts/validate_colab_tutorial.py')
          text = p.read_text()
          marker = '    "pinned worker commit check": "!= pinned",\n'
          secure = '    "candidate pipeline ref": "DIMER_TUTORIAL_REF",\n    "private source secret": "GITHUB_TOKEN",\n    "ephemeral Git auth": "GIT_CONFIG_VALUE_0",\n'
          if secure not in text:
              text = text.replace(marker, marker + secure)
          guard = '    if profile == "E2E":\n        _require_markers(nb_path.name, profile, text, E2E_REQUIRED)\n'
          replacement = guard + '        if re.search(r"https://[^/\\s\\\"\\\']+@github\\.com", text):\n            raise AssertionError(f"{nb_path.name}: credential must not appear in a Git clone URL")\n        if "!git clone -q https://github.com/{FT_REPO}.git" in text:\n            raise AssertionError(f"{nb_path.name}: private finetuner clone must use secret-backed subprocess auth")\n'
          if replacement not in text:
              if guard not in text:
                  raise SystemExit('validator E2E guard not found')
              text = text.replace(guard, replacement)
          p.write_text(text)

          p = Path('tests/test_notebook_spec_v1.py')
          text = p.read_text()
          anchor = '    assert "COMPONENTS.json" in source and "!= pinned" in source\n'
          extra = '    assert "DIMER_TUTORIAL_REF" in source\n    assert "GITHUB_TOKEN" in source\n    assert "GIT_CONFIG_VALUE_0" in source\n    assert "--no-checkout" in source and "--detach" in source\n    assert "!git clone -q https://github.com/{FT_REPO}.git" not in source\n'
          if extra not in text:
              text = text.replace(anchor, anchor + extra)
          p.write_text(text)

          p = Path('tutorials/README.md')
          text = p.read_text()
          runtime_anchor = '- The worker is pinned by immutable commit in `COMPONENTS.json`; the E2E notebook refuses to continue if the clone is not at that commit.\n'
          runtime_extra = '- Clean-runtime execution can pin the pipeline itself with `DIMER_TUTORIAL_REF`; the notebook records the detached pipeline SHA. The private finetuner clone requires `GITHUB_TOKEN` from a Colab Secret/environment and authenticates only through an ephemeral Git header (never a credential-bearing URL or persisted repo config).\n'
          if runtime_extra not in text:
              text = text.replace(runtime_anchor, runtime_anchor + runtime_extra)
          text = text.replace('**Not a Google Colab run** — a Colab record is still required before either notebook is marked release-grade.', '**Not a supported clean-runtime release record** — a clean Colab/equivalent record at the exact candidate pipeline SHA, using secret-backed private-source checkout, is still required before either notebook is marked release-grade.')
          p.write_text(text)
      - name: Self-clean and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/relay-secure-tutorial-bootstrap.yml
          git add tutorials/tabpfn_classifier_colab.ipynb tutorials/README.md scripts/validate_colab_tutorial.py tests/test_notebook_spec_v1.py
          git commit -m 'fix: secure and pin TabPFN tutorial bootstrap'
          git push origin HEAD:feat/notebook-spec-1.0
