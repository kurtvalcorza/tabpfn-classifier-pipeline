[project]
name = "tabpfn-classifier-pipeline"
version = "0.1.0"
description = "DIMER TabPFN-3 tabular-classification pipeline: public tutorial API (in-context inference, artifact bundle, validation)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
authors = [{ name = "Kurt Valcorza" }]
# Exact runtime pins (NOTEBOOK_SPEC 1.1 ENV2/PAR2): the standalone tutorials carry this list verbatim as their
# inline PINS. torch / tabpfn / pandas / scikit-learn are the previous tutorials/requirements-colab.txt pins
# (= the finetuner's requirements at the COMPONENTS.json commit); huggingface-hub is the fleet pin and stages the
# pinned checkpoint. requests / boto3 / nbformat were worker- and harness-only and are not runtime deps.
dependencies = [
  "torch==2.11.0",
  "tabpfn==8.1.0",
  "pandas==2.3.2",
  "scikit-learn==1.9.0",
  "huggingface-hub==0.36.2",
]
[project.optional-dependencies]
dev = ["pytest==8.4.1", "ruff==0.16.6", "nbformat==5.10.4", "nbclient==0.11.0", "jsonschema==4.25.1"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/tabpfn_classifier_pipeline"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["integration: exercises the real tabpfn package; run in the integration CI job"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]
# Generated notebooks (generator-owned cells) and the pre-existing repository scripts this pass did not
# restyle keep their own style.
extend-exclude = [
  "tutorials/*.ipynb",
  "scripts/execute_notebook_release.py",
  "scripts/check_component_contracts.py",
  "tests/test_contract.py",
  "tests/test_example_builder.py",
  "tests/test_integration.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
